name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails on assignment conflicts, missing icons, type errors, or a stale package.json.
      - run: bun run check
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: bin/*.vsix
